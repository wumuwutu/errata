name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # macOS runs the hook integration tests against its stock bash 3.2 —
      # real-machine coverage for the oldest supported shell.
      - run: go test ./cmd/... ./internal/...
